# Weekly upstream sync for sf/main (this file never goes upstream).
#
# Merges ColeMurray/background-agents main into a fresh branch cut from sf/main
# and opens an in-fork pull request against sf/main. A conflict opens (or
# updates) an issue instead and pushes nothing. Never pushes to sf/main, never
# opens anything upstream, never rebases.
#
# Merge the sync pull request with a MERGE COMMIT only (sf/main is never
# rebased or squashed: deployed tags are sf/main commits). The merge then
# triggers a normal SF Release.
#
# Uses the sf-release-bot App token, not GITHUB_TOKEN: pull requests opened with
# GITHUB_TOKEN do not trigger ci.yml / ci-python.yml, and an upstream merge that
# touches .github/workflows needs the Workflows permission to be pushed.
#
# Scheduled workflows run from the default branch, so the fork's default
# branch must be sf/main.
name: SF Upstream Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main into a sync branch
    if: github.repository == 'bramdokman/background-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the App credentials; deployment branches: sf/main only.
    environment: sf-release
    permissions:
      contents: read
    env:
      REPO: bramdokman/background-agents
      UPSTREAM_URL: https://github.com/ColeMurray/background-agents.git
      ISSUE_TITLE: Upstream sync needs a hand
    steps:
      - name: Mint the App token (background-agents only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SF_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SF_BOT_PRIVATE_KEY }}
          owner: bramdokman
          repositories: background-agents
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Checkout sf/main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sf/main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          up=$(git rev-parse upstream/main)
          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "up8=${up:0:8}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
            echo "sf/main already contains upstream/main ${up:0:8}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when a sync PR for this upstream commit is already open
        id: existing
        if: steps.fetch.outputs.uptodate == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          url=$(gh pr list -R "$REPO" --base sf/main --state open --json headRefName,url \
            --jq "[.[] | select(.headRefName | startswith(\"sync/upstream-\") and endswith(\"-$UP8\"))][0].url // empty")
          if [[ -n "$url" ]]; then
            echo "A sync PR for upstream $UP8 is already open: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.fetch.outputs.uptodate == 'false' && steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          branch="sync/upstream-$(date -u +%Y%m%d)-$UP8"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git checkout -b "$branch"
          if git -c "user.name=${APP_SLUG}[bot]" \
                 -c "user.email=${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
                 merge --no-ff --no-edit upstream/main -m "Merge upstream/main $UP8 into sf/main"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the sync branch and open the PR
        if: steps.merge.outputs.clean == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "Merges \`upstream/main\` @ \`$UP8\` (ColeMurray/background-agents) into \`sf/main\`."
            echo
            echo "**Merge with a merge commit only.** No squash, no rebase: deployed tags are sf/main commits."
            echo "Merging triggers SF Release, which opens the next deploy PR in software-factory."
            echo
            echo "Expected conflict points on most syncs: the frozen route catalog"
            echo "(\`hono-route-catalog-conformance.test.ts\`, \`route-admission-matrix\` snapshot) and the"
            echo "default-model tests in \`packages/github-bot\`. If CI is red on those, fix them on this branch."
            echo
            echo "### Upstream commits"
            echo '```'
            git log --oneline --no-decorate HEAD^1..upstream/main | head -n 300
            echo '```'
            echo
            echo "### Files to review closely"
            echo '```'
            git diff --name-status HEAD^1 HEAD -- \
              deploy/kubernetes \
              terraform/d1/migrations \
              .github/workflows \
              packages/control-plane/test/integration/__snapshots__ || true
            echo '```'
          } > "$body"
          # Keep well under GitHub's 65536-character body limit.
          if [[ $(wc -c < "$body") -gt 60000 ]]; then
            head -c 60000 "$body" > "$body.tmp" && mv "$body.tmp" "$body"
            printf '\n\n_(truncated)_\n' >> "$body"
          fi

          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"

          gh label create upstream-sync -R "$REPO" --color 0e8a16 \
            --description "Weekly upstream merge; merge commit only" 2> /dev/null || true
          url=$(gh pr create -R "$REPO" --base sf/main --head "$BRANCH" \
            --title "Sync upstream $UP8 (MERGE COMMIT ONLY)" --body-file "$body" --label upstream-sync)
          echo "Sync PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the conflict
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UP8: ${{ steps.fetch.outputs.up8 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo "Merging \`upstream/main\` @ \`$UP8\` into \`sf/main\` conflicts. Nothing was pushed."
            echo
            echo "Conflicted files:"
            echo '```'
            cat "$RUNNER_TEMP/conflicts.txt"
            echo '```'
            echo
            echo "Resolve locally (merge, never rebase), then merge into sf/main with a merge commit:"
            echo '```'
            echo "notes/scripts/sf-sync-upstream.sh --branch"
            echo '```'
            echo "Run: $RUN_URL"
          } > "$body"
          gh label create upstream-sync -R "$REPO" --color 0e8a16 \
            --description "Weekly upstream merge; merge commit only" 2> /dev/null || true
          number=$(gh issue list -R "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue edit "$number" -R "$REPO" --body-file "$body" > /dev/null
            gh issue comment "$number" -R "$REPO" --body "Still conflicting at upstream \`$UP8\`: $RUN_URL" > /dev/null
            echo "Updated issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create -R "$REPO" --title "$ISSUE_TITLE" --body-file "$body" --label upstream-sync)
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::warning::upstream/main $UP8 conflicts with sf/main; see the issue."
