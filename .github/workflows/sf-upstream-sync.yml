# Weekly upstream sync for sf/main (this file never goes upstream).
#
# Merges ColeMurray/background-agents main into a fresh branch cut from sf/main,
# pushes it as sync/upstream-<date>-<up8>, and opens (or refreshes) ONE issue
# "Upstream sync" with the compare link. Bram opens the pull request from that
# link himself. Never pushes to sf/main, never opens anything upstream, never
# rebases.
#
# Why no pull request and no App token: upstream code must not run in this
# repository before Bram has looked at it.
#   - The branch is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN
#     trigger no workflows. When Bram opens the PR, ci.yml / ci-python.yml run
#     (as him, with read-only tokens) on the merged tree.
#   - When upstream changes anything under .github/ (workflows, actions), nothing
#     is pushed: a workflow file on a pushed branch could run with a token of its
#     own choosing. The issue lists the files; merge those by hand after review
#     (notes/scripts/sf-sync-upstream.sh --branch). GITHUB_TOKEN cannot push
#     workflow files anyway.
#   - A conflicting merge pushes nothing either; the issue lists the conflicts.
#
# Merge the sync pull request with a MERGE COMMIT only (sf/main is never
# rebased or squashed: deployed tags are sf/main commits). The merge then
# triggers a normal SF Release.
#
# Scheduled workflows run from the default branch, so the fork's default
# branch must be sf/main. Needs Issues enabled on the fork.
name: SF Upstream Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main into a sync branch
    if: github.repository == 'bramdokman/background-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push sync/* branches (the sf-main ruleset blocks sf/main itself: PR only,
      # bypass Bram) and keep the status issue.
      contents: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      UPSTREAM_URL: https://github.com/ColeMurray/background-agents.git
      ISSUE_TITLE: Upstream sync
    steps:
      - name: Checkout sf/main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sf/main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          up=$(git rev-parse upstream/main)
          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "up8=${up:0:8}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
            echo "sf/main already contains upstream/main ${up:0:8}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close the status issue when sf/main is up to date
        if: steps.fetch.outputs.uptodate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          number=$(gh issue list -R "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue close "$number" -R "$REPO" --comment "sf/main contains upstream/main \`$UP8\`." > /dev/null
          fi

      - name: Skip when a sync branch for this upstream commit exists
        id: existing
        if: steps.fetch.outputs.uptodate == 'false'
        env:
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          branch=$(git ls-remote --heads origin "refs/heads/sync/upstream-*-$UP8" | awk '{print $2}' | head -n1)
          if [[ -n "$branch" ]]; then
            echo "Sync branch ${branch#refs/heads/} for upstream $UP8 already exists." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.fetch.outputs.uptodate == 'false' && steps.existing.outputs.exists == 'false'
        env:
          UP8: ${{ steps.fetch.outputs.up8 }}
        run: |
          branch="sync/upstream-$(date -u +%Y%m%d)-$UP8"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if git -c "user.name=github-actions[bot]" \
                 -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" \
                 merge --no-ff --no-edit upstream/main -m "Merge upstream/main $UP8 into sf/main"; then
            # Upstream changes under .github/ never reach a pushed branch unreviewed.
            git diff --name-status HEAD^1 HEAD -- .github > "$RUNNER_TEMP/dotgithub.txt"
            if [[ -s "$RUNNER_TEMP/dotgithub.txt" ]]; then
              echo "state=workflows" >> "$GITHUB_OUTPUT"
            else
              echo "state=clean" >> "$GITHUB_OUTPUT"
            fi
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the sync branch
        if: steps.merge.outputs.state == 'clean'
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          # GITHUB_TOKEN push: triggers no workflow on the branch.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"

      - name: Open or refresh the status issue
        if: steps.merge.outputs.state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.merge.outputs.state }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UP8: ${{ steps.fetch.outputs.up8 }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            case "$STATE" in
              clean)
                echo "Merging \`upstream/main\` @ \`$UP8\` into \`sf/main\` is clean and touches nothing under \`.github/\`."
                echo "It is pushed as \`$BRANCH\`. CI has NOT run on it yet: look at the diff, then open the PR"
                echo "(base \`sf/main\`); CI runs when you open it."
                echo
                echo "**Open the PR:** $SERVER/$REPO/compare/sf/main...$BRANCH?expand=1"
                echo
                echo "**Merge with a merge commit only.** No squash, no rebase: deployed tags are sf/main commits."
                echo "Merging triggers SF Release, which opens the next deploy PR in software-factory."
                echo
                echo "Expected red spots on most syncs: the frozen route catalog"
                echo "(\`hono-route-catalog-conformance.test.ts\`, \`route-admission-matrix\` snapshot) and the"
                echo "default-model tests in \`packages/github-bot\`. Fix them on the branch."
                echo
                echo "### Files to review closely"
                echo '```'
                git diff --name-status HEAD^1 HEAD -- \
                  deploy/kubernetes \
                  terraform/d1/migrations \
                  package.json package-lock.json \
                  packages/control-plane/test/integration/__snapshots__ || true
                echo '```'
                echo
                echo "### Upstream commits"
                echo '```'
                git log --oneline --no-decorate HEAD^1..upstream/main | head -n 300
                echo '```'
                ;;
              workflows)
                echo "Merging \`upstream/main\` @ \`$UP8\` into \`sf/main\` changes files under \`.github/\`. Nothing was pushed:"
                echo "a workflow on a pushed branch would run before review."
                echo
                echo '```'
                cat "$RUNNER_TEMP/dotgithub.txt"
                echo '```'
                echo
                echo "Review those files, then merge locally (merge, never rebase) and push the branch yourself:"
                echo '```'
                echo "notes/scripts/sf-sync-upstream.sh --branch"
                echo '```'
                ;;
              conflict)
                echo "Merging \`upstream/main\` @ \`$UP8\` into \`sf/main\` conflicts. Nothing was pushed."
                echo
                echo "Conflicted files:"
                echo '```'
                cat "$RUNNER_TEMP/conflicts.txt"
                echo '```'
                echo
                echo "Resolve locally (merge, never rebase), then merge into sf/main with a merge commit:"
                echo '```'
                echo "notes/scripts/sf-sync-upstream.sh --branch"
                echo '```'
                ;;
            esac
            echo
            echo "Run: $RUN_URL"
          } > "$body"
          # Keep well under GitHub's 65536-character body limit.
          if [[ $(wc -c < "$body") -gt 60000 ]]; then
            head -c 60000 "$body" > "$body.tmp" && mv "$body.tmp" "$body"
            printf '\n\n_(truncated)_\n' >> "$body"
          fi
          gh label create upstream-sync -R "$REPO" --color 0e8a16 \
            --description "Weekly upstream merge; merge commit only" 2> /dev/null || true
          number=$(gh issue list -R "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue edit "$number" -R "$REPO" --body-file "$body" > /dev/null
            gh issue comment "$number" -R "$REPO" --body "Upstream \`$UP8\`: $STATE. $RUN_URL" > /dev/null
            echo "Updated issue #$number ($STATE)" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create -R "$REPO" --title "$ISSUE_TITLE" --body-file "$body" --label upstream-sync)
            echo "Opened $url ($STATE)" >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$STATE" == "clean" ]] || echo "::warning::upstream/main $UP8: $STATE; see the issue."
